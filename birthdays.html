<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Birthdays</title>
    <style>
        @font-face {
            font-family: "DM Sans";
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
            src: url('fonts/DMSans-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: "DM Sans";
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
            src: url('fonts/DMSans-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: "DM Sans", Arial, Helvetica, sans-serif;
            background-color: #444444;
        }

        #decor {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background-image: url('birthday-confetti.png');
            background-repeat: repeat-y;
            background-position: top center;
            background-size: 100% auto;
        }

        #stage {
            position: relative;
            z-index: 1;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 6vh 6vw;
        }

        #cake {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            padding-bottom: 2vh;
        }

        .cake-illustration {
            width: min(26vw, 34vh);
            height: auto;
        }

        @media (orientation: portrait) {
            .cake-illustration {
                width: min(50vw, 30vh);
            }
        }

        #heading {
            flex: 0 0 auto;
            margin: 0;
            text-align: center;
            color: #ea9999;
            font-weight: 900;
            padding: 2vh 0 0;
            font-size: clamp(2rem, 9vmin, 6rem);
        }

        #birthdayBox {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        #birthdayList {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            justify-content: center;
            align-content: center;
            justify-items: center;
            column-gap: 1.4em;
            row-gap: 0.25em;
            max-width: 100%;
            color: #ffffff;
            font-weight: 400;
            line-height: 1.25;
        }

        .birthday-name {
            white-space: nowrap;
            text-align: center;
        }

        #fallback {
            position: relative;
            z-index: 2;
            display: none;
            height: 100vh;
            width: 100vw;
            object-fit: cover;
        }

        body.no-birthdays #decor {
            display: none;
        }

        body.no-birthdays #stage {
            display: none;
        }

        body.no-birthdays #fallback {
            display: block;
        }
    </style>
</head>
<body>
    <div id="decor" aria-hidden="true"></div>

    <div id="stage">
        <div id="cake" aria-hidden="true">
            <img class="cake-illustration" src="birthday-cake.png" alt="">
        </div>
        <div id="birthdayBox">
            <div id="birthdayList"></div>
        </div>
        <h1 id="heading">Happy Birthday!</h1>
    </div>
    <img id="fallback" alt="Imperial">

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const box = document.getElementById('birthdayBox');
            const list = document.getElementById('birthdayList');
            const heading = document.getElementById('heading');
            const fallback = document.getElementById('fallback');

            let names = [];

            function parseCSV(text) {
                return text.split('\n')
                    .map(function (line) { return line.trim(); })
                    .filter(function (line) { return line.length > 0; })
                    .map(function (line) { return line.split(',').map(function (cell) { return cell.trim(); }); });
            }

            // BirthDate is YYYY-MM-DD; compare month/day only, ignoring year,
            // without routing through `new Date(dateStr)` (which parses as UTC
            // and can shift the day depending on local timezone).
            function isTodayBirthday(dateStr) {
                const parts = dateStr.split('-');
                const today = new Date();
                return parseInt(parts[1], 10) === today.getMonth() + 1 &&
                    parseInt(parts[2], 10) === today.getDate();
            }

            function updateFallbackImage() {
                const isLandscape = window.innerWidth >= window.innerHeight;
                fallback.src = isLandscape ? '1080p-imperial-sign.jpg' : '1080p-imperial-sign-vertical.jpg';
            }

            // Column count as a function of how many names there are today —
            // deliberately independent of orientation, so the same day's
            // names arrange the same way in landscape and portrait. Small
            // counts stay a single readable column; more names step up to
            // additional columns so the list doesn't run too tall (and font
            // size too small) to fit.
            function columnsForCount(count) {
                if (count <= 4) return 1;
                if (count <= 8) return 2;
                if (count <= 15) return 3;
                return 4;
            }

            function renderNames() {
                list.innerHTML = '';
                const columns = columnsForCount(names.length);
                const rows = Math.ceil(names.length / columns);
                list.style.gridTemplateRows = 'repeat(' + rows + ', max-content)';
                names.forEach(function (name) {
                    const span = document.createElement('span');
                    span.className = 'birthday-name';
                    span.textContent = name;
                    list.appendChild(span);
                });
            }

            // Binary search for the largest font size that still fits the
            // available box, so the display scales cleanly from 1 name to a
            // crowded day without a fixed size table. clientWidth/clientHeight
            // include the box's own padding, so that padding must be
            // subtracted to get the actual area available to its content —
            // otherwise the fitted text overflows into (and is clipped by)
            // the padding, cutting names off at the edges. Capped below the
            // heading's own size so names never grow larger than "Happy
            // Birthday!" even when there's only one name to display.
            function fitText() {
                if (!names.length) return;
                const cs = getComputedStyle(box);
                const availWidth = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
                const availHeight = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
                const headingSize = parseFloat(getComputedStyle(heading).fontSize);

                let lo = 8, hi = Math.max(lo, Math.floor(headingSize * 0.8));
                while (lo < hi) {
                    const mid = Math.ceil((lo + hi) / 2);
                    list.style.fontSize = mid + 'px';
                    const fits = list.scrollWidth <= availWidth && list.scrollHeight <= availHeight;
                    if (fits) {
                        lo = mid;
                    } else {
                        hi = mid - 1;
                    }
                }
                list.style.fontSize = lo + 'px';
            }

            function handleResize() {
                if (document.body.classList.contains('no-birthdays')) {
                    updateFallbackImage();
                } else {
                    fitText();
                }
            }

            let resizeTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(handleResize, 100);
            });

            fetch('birthdays.csv')
                .then(function (response) { return response.text(); })
                .then(function (data) {
                    const rows = parseCSV(data);
                    names = rows
                        .filter(function (row) { return row.length >= 2 && isTodayBirthday(row[0]); })
                        .map(function (row) { return row[1]; });

                    if (names.length === 0) {
                        document.body.classList.add('no-birthdays');
                        updateFallbackImage();
                    } else {
                        renderNames();
                        fitText();
                    }
                })
                .catch(function (error) {
                    console.error('Error loading birthdays.csv:', error);
                });
        });
    </script>
</body>
</html>
